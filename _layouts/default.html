<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}AQua.CAI — Yonsei University</title>
<meta name="description" content="{{ page.description | default: 'Advanced Quantum Computing and Artificial Intelligence at Yonsei University. Research in quantum information, algorithms, learning, communication, and sensing.' | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title | escape }} · AQua.CAI">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/social.svg' | absolute_url }}">
<meta name="theme-color" content="#102e3b">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
{% if page.search %}<script src="{{ '/assets/js/publications.js' | relative_url }}" defer></script>{% endif %}
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
{% include header.html %}
<main id="main">{{ content }}</main>
{% include footer.html %}
</body>
</html>
